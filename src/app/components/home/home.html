<!-- auth.user() es una signal: si cambia la sesión, esta plantilla se actualiza sola -->
@if (auth.user(); as user) {
  <h1>Hola, {{ user.name }}</h1>
  <p class="muted">Has iniciado sesión como {{ user.email }} con el rol {{ user.role }}.</p>

  <p>Bienvenido a Studate. Desde aquí se gestionarán los usuarios, los votos de La Orla y los Dates.</p>
}
